name: deploy

# Build the Astro revamp and deploy to GitHub Pages.
# CUTOVER DONE (2026-07-04): revamp IS production (beta). Pushes to revamp —
# including the Phase-5 bot's gallery commits — auto-deploy the live site.
#
# Mechanism: build → force-push dist/ to the gh-pages branch; Pages serves
# gh-pages via the legacy branch pipeline. actions/deploy-pages@v5 was retired
# here after repeated opaque "Deployment failed, try again later" backend
# rejections (2026-07-04); the branch pipeline has months of green builds on
# this repo. CNAME ships in dist/ via public/CNAME; .nojekyll added at deploy.
on:
  push:
    branches: [revamp]
  workflow_dispatch:

# Least-privilege: contents write is required to push the gh-pages branch (T-01-01).
permissions:
  contents: write

# Allow one concurrent deploy; let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        # npm install, not npm ci: the committed lockfile's bundled-optional
        # accounting for @tailwindcss/oxide-wasm32-wasi differs between npm
        # versions (EUSAGE "Missing: @emnapi/*"), and that wasm optional never
        # installs on linux-x64 anyway. install still pins via the lockfile.
        run: npm install --no-audit --no-fund
      - name: Build Astro site
        run: npm run build
      - name: Push dist to gh-pages
        run: |
          cd dist
          touch .nojekyll
          echo "${GITHUB_SHA}" > build.txt
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify live site + self-heal
        # Pages' internal deployment finalizer intermittently rejects deploys
        # that land while the previous one is still propagating ("Deployment
        # failed, try again later" — hits removal commits that follow a publish
        # within ~2 min). Every gh-pages push carries the FULL site state, so
        # convergence is safe: poll the live build fingerprint; if Pages didn't
        # pick this deploy up, push a fresh gh-pages commit to trigger a new
        # internal build. Non-blocking: the next deploy or the scheduled healer
        # (pages-heal.yml on main) converges any residual miss.
        run: |
          verify() {
            for i in $(seq 1 8); do
              sleep 15
              LIVE=$(curl -fsSL "https://nocturna-avatars.site/build.txt?cb=${RANDOM}${RANDOM}" 2>/dev/null || echo none)
              echo "live build: ${LIVE} (want ${GITHUB_SHA})"
              [ "${LIVE}" = "${GITHUB_SHA}" ] && return 0
            done
            return 1
          }
          for attempt in 1 2 3; do
            if verify; then echo "Live site is serving this deploy."; exit 0; fi
            echo "Not converged — nudging Pages with a fresh gh-pages commit (attempt ${attempt})"
            cd dist
            date -u +%FT%TZ > .heal
            git add -A
            git commit -m "deploy: ${GITHUB_SHA} (heal ${attempt})"
            git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
            cd ..
          done
          if verify; then echo "Live site is serving this deploy."; exit 0; fi
          echo "::warning::Live site did not converge to ${GITHUB_SHA}; next deploy or pages-heal will retry"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
